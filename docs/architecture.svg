<text x="234" y="404" font-size="15" font-weight="700" fill="#15302e">CRM (Next.js)</text>
<text x="234" y="426" font-size="13" fill="#4a5d5a">Pipeline, lead profile, AI summary</text>
<text x="234" y="445" font-size="13" fill="#4a5d5a">Routing with reasons</text>
<text x="234" y="464" font-size="13" fill="#4a5d5a">Bookings, payments, dashboard</text>
<text x="234" y="483" font-size="13" fill="#4a5d5a">Signed webhooks in</text>
