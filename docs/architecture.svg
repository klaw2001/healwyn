<text x="234" y="104" font-size="13" fill="#4a5d5a">Booking and test payments</text>
<text x="234" y="123" font-size="13" fill="#4a5d5a">Assistant widget: typed or voice</text>
<rect x="220" y="240" width="250" height="100" rx="10" fill="#d7ece8" stroke="#0f6b63" stroke-width="2"/>
<text x="234" y="264" font-size="15" font-weight="700" fill="#15302e">Industry packs</text>
<text x="234" y="286" font-size="13" fill="#4a5d5a">Brand, copy, questions, stages,</text>
<text x="234" y="305" font-size="13" fill="#4a5d5a">sequences, routing, voice script,</text>
<text x="234" y="324" font-size="13" fill="#4a5d5a">safety rules, demo data</text>
