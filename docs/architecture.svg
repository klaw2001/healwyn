<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="architecture-title architecture-desc" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
<title id="architecture-title">How the platform fits together</title>
<desc id="architecture-desc">Visitors use the website, which stores enquiries, bookings and test payments in Postgres through a least-privilege role and talks to the Python intake assistant with signed requests. The assistant uses LiveKit for voice and Gemini only to map answers to allowed options, and posts signed call results to the CRM. Staff use the CRM, which reads Postgres under row level security. A nurture worker sends due messages by email through Resend. Razorpay sends signed payment webhooks to the website. Industry packs configure the website, the CRM, the worker and the assistant.</desc>
